# 단위 테스트와 키 유출 검사. 유료 API·DB 없이 돈다(평가는 로컬에서 수동으로 돌린다).
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backends/requirements.txt
      - name: 의존성 설치(torch는 CPU용)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt pytest pytest-asyncio
      - name: 단위 테스트
        run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/corp-advisor--app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontends/corp-advisor--app/package-lock.json
      - run: npm ci
      - name: 타입 검사와 빌드
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 키 유출 검사(gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
